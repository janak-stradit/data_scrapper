services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - ${HOME}/data_scrapper.env
    volumes:
      - ${HOME}/data_scrapper_output:/app/output
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOME}/data_scrapper_certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
