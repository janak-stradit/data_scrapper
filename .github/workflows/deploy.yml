name: Deploy to EC2

# Builds happen on the EC2 box itself (not in CI, not pushed to a
# registry) — no registry secrets to manage, and the instance already has
# everything needed to build its own image. Code is synced over with
# rsync rather than a git pull on the box, so the box never needs its own
# GitHub credentials.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets were added as environment secrets under "prod" — GitHub
    # Actions only injects those into a job that declares this, otherwise
    # ${{ secrets.* }} silently resolves to an empty string.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
            --exclude=.git
            --exclude=.github
            --exclude=output
            --exclude=.env
            --exclude=custom_targets.json
          path: ./
          remote_path: ~/data_scrapper/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      # The production .env lives in the PROD_ENV_FILE environment secret
      # (the whole file, pasted as-is) and is written to
      # ~/data_scrapper.env — what docker-compose.yml's env_file reads —
      # on every deploy. Streamed over ssh stdin rather than through an
      # action input or a command-line argument, so the contents never
      # appear in a process list or the log. If the secret is unset the
      # step leaves the server's existing file alone rather than
      # replacing it with an empty one.
      - name: Write production env file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_ENV_FILE}" ]; then
            echo "::warning::PROD_ENV_FILE secret is not set — keeping the env file already on the server."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Strip Windows line endings in case the secret was pasted from
          # a CRLF file — docker compose would keep the \r in every value.
          printf '%s\n' "$PROD_ENV_FILE" | tr -d '\r' | ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            'umask 077 && cat > ~/data_scrapper.env.tmp && mv ~/data_scrapper.env.tmp ~/data_scrapper.env && echo "env file written: $(grep -c "=" ~/data_scrapper.env) variables"'
          rm -f ~/.ssh/deploy_key

      - name: Build image and restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # One-time cleanup: earlier deploys ran a standalone
            # "data-scrapper" container bound to host port 80, which
            # would otherwise conflict with Caddy claiming that port.
            # Harmless no-op once that container is gone.
            docker stop data-scrapper 2>/dev/null || true
            docker rm data-scrapper 2>/dev/null || true

            # Self-signed cert for Caddy, generated once (not regenerated
            # on every deploy — that would invalidate every browser's
            # already-accepted trust exception for no reason). The IP
            # goes in as a SAN, which is what browsers actually check for
            # an IP-address URL (the CN is effectively legacy/ignored).
            mkdir -p ~/data_scrapper_certs
            if [ ! -f ~/data_scrapper_certs/self-signed.crt ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout ~/data_scrapper_certs/self-signed.key \
                -out ~/data_scrapper_certs/self-signed.crt \
                -subj "/CN=${{ secrets.EC2_HOST }}" \
                -addext "subjectAltName=IP:${{ secrets.EC2_HOST }}"
            fi

            cd ~/data_scrapper
            mkdir -p ~/data_scrapper_output
            docker compose up -d --build
            docker image prune -f
